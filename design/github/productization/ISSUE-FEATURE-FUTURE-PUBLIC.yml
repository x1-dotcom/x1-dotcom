name: Future-public feature proposal
description: Propose a focused capability within the intended public boundary
title: "[FEATURE] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: publicboundary
    attributes:
      label: Future-public boundary
      description: Explain why this belongs in the standalone public product rather than a private X1 authority.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility / integration impact
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How will source, test and runtime evidence be produced?
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Dependency / licensing impact
      description: List new libraries, assets or third-party components and their public-release basis.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This proposal does not require production credentials, customer/provider data or protected X1 implementation details.
          required: true
        - label: Any new dependencies/assets will have a compatible public-release basis.
          required: true
