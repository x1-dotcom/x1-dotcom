<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="X1 — Public software. Private engineering.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060A"/><stop offset=".55" stop-color="#071018"/><stop offset="1" stop-color="#02070C"/></linearGradient>
    <linearGradient id="x" x1="0" x2="1"><stop stop-color="#19F6FF"/><stop offset=".5" stop-color="#11C9FF"/><stop offset="1" stop-color="#326BFF"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 7.5H8" stroke="#A9EDFF" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#scan)"/>

  <!-- X1 signature rails -->
  <path d="M0 0H590L530 64H0ZM0 420H590L530 356H0Z" fill="#0A1C27"/>
  <path d="M1600 0H1010L1070 64H1600ZM1600 420H1010L1070 356H1600Z" fill="#081620"/>
  <path d="M0 64H530L470 124H0M1600 64H1070L1130 124H1600" fill="none" stroke="#13DFFF" stroke-opacity=".28" stroke-width="2"/>

  <!-- oversized X1 -->
  <g transform="translate(92 72)" filter="url(#glow)">
    <text x="0" y="222" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="250" fill="url(#x)" letter-spacing="-25">X1</text>
    <path d="M16 258H440" stroke="#18ECFF" stroke-width="5"/>
    <text x="18" y="302" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#DFFBFF" letter-spacing="7">SOFTWARE • SYSTEMS • OPERATIONS</text>
  </g>

  <!-- manifesto -->
  <g transform="translate(660 72)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="38" font-size="16" fill="#6ED8EA" letter-spacing="5">X1 / PUBLIC FACE</text>
    <text x="0" y="98" font-size="45" font-weight="800" fill="#FFFFFF">PUBLIC SOFTWARE.</text>
    <text x="0" y="148" font-size="45" font-weight="800" fill="#17E8FF">PRIVATE ENGINEERING.</text>
    <text x="0" y="198" font-size="45" font-weight="800" fill="#FFFFFF">ONE X1 IDENTITY.</text>

    <g transform="translate(0 235)">
      <rect width="360" height="72" rx="10" fill="#071921" stroke="#19E8FF" stroke-width="2"/>
      <text x="20" y="29" font-size="13" fill="#65DDF0" letter-spacing="3">PUBLIC / FREE</text>
      <text x="20" y="53" font-size="20" font-weight="700" fill="#F2FEFF">BUILT TO BE USED</text>
    </g>
    <g transform="translate(382 235)">
      <rect width="360" height="72" rx="10" fill="#0A111B" stroke="#4777FF" stroke-width="2"/>
      <text x="20" y="29" font-size="13" fill="#7FA0FF" letter-spacing="3">COMMERCIAL / PRIVATE</text>
      <text x="20" y="53" font-size="20" font-weight="700" fill="#F6F8FF">BUILT TO OPERATE</text>
    </g>
  </g>

  <!-- pulse mark -->
  <g transform="translate(1430 180)" fill="none" stroke="#19E8FF" stroke-width="4">
    <path d="M0 30h35l16-30 22 62 20-42h47"/>
    <circle cx="140" cy="20" r="5" fill="#19E8FF" stroke="none"/>
  </g>

  <text x="800" y="394" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6FBDCB" letter-spacing="7">X1 • FREE MEANS FUNCTIONAL • PRIVATE MEANS PROTECTED</text>
</svg>
