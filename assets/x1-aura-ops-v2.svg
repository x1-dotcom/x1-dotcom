</g>
<rect x="70" y="420" width="1460" height="1" fill="#243942"/>
<text x="70" y="468" fill="#F4FAFD" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">BY THE TIME THE CUSTOMER SEES THE ALERT, THE SUPPORTED ISSUE MAY ALREADY BE RESOLVED.</text>
<text x="70" y="498" fill="#718690" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">SAFE AUTOMATION // POLICY-CONTROLLED // PROPRIETARY INTERNALS</text>
