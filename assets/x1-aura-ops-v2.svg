<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="AURA autonomous operations">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#05080B"/><stop offset="1" stop-color="#07131A"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#21F2FF"/><stop offset="1" stop-color="#5A7CFF"/></linearGradient></defs>
<rect width="1600" height="520" rx="30" fill="url(#bg)"/>
<text x="70" y="72" fill="#788F99" font-family="Arial,Helvetica,sans-serif" font-size="18" letter-spacing="7">AURA // INTELLIGENT OPERATIONS</text>
<text x="70" y="132" fill="#F4FAFD" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800">SUPPORT SHOULD END WITH A RESULT.</text>
<text x="70" y="170" fill="#91A7B0" font-family="Arial,Helvetica,sans-serif" font-size="22">Not another chatbot. An operational layer designed to detect, act safely, verify and communicate.</text>
<g font-family="Arial,Helvetica,sans-serif" transform="translate(70 245)">
  <g><circle cx="70" cy="70" r="62" fill="#071D24" stroke="#1FE9F7" stroke-width="2"/><text x="70" y="63" text-anchor="middle" fill="#1FE9F7" font-size="17" font-weight="700" letter-spacing="3">01</text><text x="70" y="88" text-anchor="middle" fill="#F4FAFD" font-size="18" font-weight="800">DETECT</text></g>
  <path d="M145 70h125" stroke="#25414C" stroke-width="3"/><path d="M258 60l18 10-18 10" fill="none" stroke="#1FE9F7" stroke-width="3"/>
  <g transform="translate(280)"><circle cx="70" cy="70" r="62" fill="#071D24" stroke="#1FE9F7" stroke-width="2"/><text x="70" y="63" text-anchor="middle" fill="#1FE9F7" font-size="17" font-weight="700" letter-spacing="3">02</text><text x="70" y="88" text-anchor="middle" fill="#F4FAFD" font-size="18" font-weight="800">UNDERSTAND</text></g>
  <path d="M425 70h125" stroke="#25414C" stroke-width="3"/><path d="M538 60l18 10-18 10" fill="none" stroke="#1FE9F7" stroke-width="3"/>
  <g transform="translate(560)"><circle cx="70" cy="70" r="62" fill="#071D24" stroke="#1FE9F7" stroke-width="2"/><text x="70" y="63" text-anchor="middle" fill="#1FE9F7" font-size="17" font-weight="700" letter-spacing="3">03</text><text x="70" y="88" text-anchor="middle" fill="#F4FAFD" font-size="18" font-weight="800">REMEDIATE</text></g>
  <path d="M705 70h125" stroke="#25414C" stroke-width="3"/><path d="M818 60l18 10-18 10" fill="none" stroke="#1FE9F7" stroke-width="3"/>
  <g transform="translate(840)"><circle cx="70" cy="70" r="62" fill="#071D24" stroke="#1FE9F7" stroke-width="2"/><text x="70" y="63" text-anchor="middle" fill="#1FE9F7" font-size="17" font-weight="700" letter-spacing="3">04</text><text x="70" y="88" text-anchor="middle" fill="#F4FAFD" font-size="18" font-weight="800">VERIFY</text></g>
  <path d="M985 70h125" stroke="#25414C" stroke-width="3"/><path d="M1098 60l18 10-18 10" fill="none" stroke="#1FE9F7" stroke-width="3"/>
