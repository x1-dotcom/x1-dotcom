<text x="70" y="414" fill="#EAF2F5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">WE EXPLAIN CAPABILITY WITHOUT PUBLISHING THE BLUEPRINT NEEDED TO REPRODUCE THE PRIVATE PLATFORM.</text>
